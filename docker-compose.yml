version: '3.9'

# ─────────────────────────────────────────────────────────────────────────────
#  PhysIQ · Docker Compose
#
#  Services:
#    db       — MySQL 8 database
#    engine   — Flask background logic engine  (internal, port 5001)
#    relay    — Flask relay server             (public,   port 5000)
#    frontend — Vite dev server                (public,   port 3000)
#
#  Start everything:
#    docker compose up --build
#
#  First-time database setup (run once after `docker compose up`):
#    docker compose exec db mysql -u physiq -pphysiq physiq < database/schema.sql
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── MySQL 8 ──────────────────────────────────────────────────────────────────
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE:      physiq
      MYSQL_USER:          physiq
      MYSQL_PASSWORD:      physiq
    ports:
      - "3306:3306"       # exposed to host for GUI tools (TablePlus, DBeaver)
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost",
             "-u", "physiq", "-pphysiq"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # ── Background engine (internal only) ────────────────────────────────────────
  engine:
    build:
      context: ./engine
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL:        mysql+pymysql://physiq:physiq@db:3306/physiq
      ALLOWED_RELAY_HOSTS: relay,127.0.0.1
    expose:
      - "5001"            # NOT published to host — only reachable by relay
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal          # shares network with relay and db only
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:5001/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ── Relay server (public-facing) ──────────────────────────────────────────────
  relay:
    build:
      context: ./relay
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL:       mysql+pymysql://physiq:physiq@db:3306/physiq
      ENGINE_BASE_URL:    http://engine:5001
      JWT_SECRET:         ${JWT_SECRET:-change-me-before-deploying}
      FRONTEND_ORIGIN:    ${FRONTEND_ORIGIN:-http://localhost:3000}
      REDIS_URL:          ${REDIS_URL:-}   # empty → in-memory cache
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
      engine:
        condition: service_healthy
    networks:
      - internal
      - public
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:5000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ── React frontend (Vite dev server) ─────────────────────────────────────────
  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      VITE_API_URL: ""    # empty → Vite proxy handles /auth, /sessions etc.
    ports:
      - "3000:3000"
    depends_on:
      - relay
    networks:
      - public

volumes:
  db_data:
  frontend_node_modules:

networks:
  internal:               # db + engine + relay only — engine never touches public
  public:                 # relay + frontend
